name: validate

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick poppler-utils libreoffice
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build self-contained skill bundle
        run: python scripts/build_npx_bundle.py --check
      - name: Check documentation
        run: python scripts/check_docs.py
      - name: Run regression suite
        run: python scripts/regression_suite.py
